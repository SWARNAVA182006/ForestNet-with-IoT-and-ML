<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForestNet - Next-Gen AI Incident Command Center</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

      :root {
        --bg-dark: #07090e;
        --panel-bg: rgba(15, 23, 42, 0.75);
        --panel-border: rgba(30, 41, 59, 0.8);
        --accent-green: #10b981;
        --accent-emerald: #059669;
        --accent-red: #ef4444;
        --accent-orange: #f97316;
        --accent-blue: #3b82f6;
        --accent-cyan: #06b6d4;
        --accent-purple: #8b5cf6;
      }

      body {
        font-family: 'Geist', sans-serif;
        background-color: var(--bg-dark);
        color: #f1f5f9;
        background-image: 
          radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
          radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
          radial-gradient(circle at 50% 50%, rgba(239, 68, 68, 0.03) 0%, transparent 60%);
      }

      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }

      /* Glassmorphism Panel */
      .glass-panel {
        background: rgba(13, 18, 30, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        border-radius: 0.75rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .glass-panel:hover {
        border-color: rgba(16, 185, 129, 0.25);
        box-shadow: 0 12px 40px 0 rgba(16, 185, 129, 0.1);
      }

      /* Radar Sweep Animation */
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .radar-sweeper {
        animation: radar-sweep 4s linear infinite;
        transform-origin: center;
      }

      /* Pulsing Glow */
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 8px rgba(16,185,129,0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(16,185,129,0.9)); }
      }
      .glow-pulse {
        animation: pulse-glow 2.5s ease-in-out infinite;
      }

      /* Scanline Effect for AI Media Viewers */
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(1000%); }
      }
      .scanline-effect::after {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; height: 4px;
        background: linear-gradient(180deg, transparent, rgba(16, 185, 129, 0.8), transparent);
        animation: scanline 3s linear infinite;
        opacity: 0.6;
        pointer-events: none;
      }

      /* Custom Sleek Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #07090e;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #10b981;
      }

      /* Navigation Styling */
      .nav-btn {
        position: relative;
        transition: all 0.25s ease;
      }
      .nav-btn.active {
        background: linear-gradient(90deg, rgba(16, 185, 129, 0.15) 0%, rgba(16, 185, 129, 0) 100%);
        color: #10b981;
        border-left: 3px solid #10b981;
      }

      /* Leaflet Dark Mode Map Overrides */
      .leaflet-container {
        background: #07090e !important;
        border-radius: 0.75rem;
      }
      .leaflet-popup-content-wrapper, .leaflet-popup-tip {
        background: #0f172a !important;
        color: #f1f5f9 !important;
        border: 1px solid rgba(16, 185, 129, 0.3);
        box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      }
    </style>
  </head>
  <body class="bg-[#07090e] text-slate-100 antialiased overflow-hidden selection:bg-emerald-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
